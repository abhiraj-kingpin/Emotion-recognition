# Render.com Blueprint — https://render.com/docs/blueprint-spec
# Lives at the repo root on purpose: Render's "New +" -> "Blueprint" flow
# auto-detects render.yaml here with zero extra configuration. It builds
# backend/Dockerfile with the full repo as build context (needed so it can
# COPY ../ml alongside backend/ — see backend/Dockerfile).
services:
  - type: web
    name: emotionsense-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
    autoDeploy: true
